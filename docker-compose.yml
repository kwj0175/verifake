services:
  app:
    build: .
    container_name: verifake_backend
    tty: true
    stdin_open: true
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./storage:/app/storage
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "mysql+pymysql://user:password@db:3306/verifake_db"
    cpus: "1"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn services.backend.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - backend_network

  db:
    image: mysql:8.0
    container_name: verifake_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: verifake_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uuser", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge
